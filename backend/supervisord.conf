[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:api]
command=gunicorn -w 1 -k uvicorn.workers.UvicornWorker --timeout 120 --bind 0.0.0.0:8000 app.main:app
directory=/home/site/wwwroot
autostart=true
autorestart=true
stderr_logfile=/tmp/api.err.log
stdout_logfile=/tmp/api.out.log
environment=PYTHONUNBUFFERED="1"

[program:worker]
command=celery -A app.workers.celery_app worker --loglevel=info -Q search,score,research,resume -c 2 -n worker@%%h
directory=/home/site/wwwroot
autostart=true
autorestart=true
stderr_logfile=/tmp/worker.err.log
stdout_logfile=/tmp/worker.out.log
environment=PYTHONUNBUFFERED="1"
