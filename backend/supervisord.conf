[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:api]
command=gunicorn -w 1 -k uvicorn.workers.UvicornWorker --timeout 120 --bind 0.0.0.0:8000 app.main:app
directory=/home/site/wwwroot
autostart=true
autorestart=true
stderr_logfile=/tmp/api.err.log
stdout_logfile=/tmp/api.out.log
environment=PYTHONUNBUFFERED="1"

[program:worker]
# Single default queue (no -Q) + lean flags: --without-gossip/--without-mingle
# /--without-heartbeat kill the inter-worker broadcast polling that (with 4
# queues) burned the Upstash 500K/mo request cap. See celery_app.py.
command=celery -A app.workers.celery_app worker --loglevel=info -c 2 -n worker@%%h --without-gossip --without-mingle --without-heartbeat
directory=/home/site/wwwroot
autostart=true
autorestart=true
stderr_logfile=/tmp/worker.err.log
stdout_logfile=/tmp/worker.out.log
environment=PYTHONUNBUFFERED="1"
