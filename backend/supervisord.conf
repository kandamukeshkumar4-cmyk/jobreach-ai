[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:api]
command=/bin/sh -c 'gunicorn -w 1 -k uvicorn.workers.UvicornWorker --timeout 120 --bind 0.0.0.0:${PORT:-8000} app.main:app'
directory=/app
autostart=true
autorestart=true
# Stream child logs to the container's stdout/stderr so the platform (Railway)
# captures them. maxbytes=0 disables supervisord log rotation, which can't work
# on the non-regular /dev/stdout device.
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"

[program:worker]
# Single default queue (no -Q) + lean flags: --without-gossip/--without-mingle
# /--without-heartbeat kill the inter-worker broadcast polling that (with 4
# queues) burned the Upstash 500K/mo request cap. See celery_app.py.
command=celery -A app.workers.celery_app worker --loglevel=info -c 2 -n worker@%%h --without-gossip --without-mingle --without-heartbeat
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"
